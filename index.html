<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Emilys+Candy&display=swap" rel="stylesheet">
    <title>Match Donut Game!</title>
</head>
<body>

<div class="container" style="display:none"> <!-- START OF CONTAINER DIV -->

<!-- This div is to hold my donut objectives for the player to fulfill -->
<div class="donut-objective"> <!-- START OF DONUT OBJECTIVE DIV -->

</div> <!-- END OF DONUT OBJECTIVE DIV -->

<!-- This div here is to contain the image and also include the send button for when the donut is added to the box  -->
<div class="donut-container"> <!-- START OF DONUT CONTAINER DIV -->

    <div class="donut-box"> <!-- This div will be where I have my donut background image -->

        <!-- DONUT BACKGROUND IMAGE HERE-->

        <div class="donut-takeaway"> <!-- This div stores all the donut here -->
        <!-- <div class="donut">DONUT PLACEMENT</div> -->
        </div>
    </div>

    <button>SEND ORDER!</button>

</div> <!-- END OF DONUT CONTAINER -->

<div class="donut-sidebar"> <!-- START OF SIDEBAR DIV -->

    <div class="donut-selection">
        <div class="donut-clicker"></div>
    </div> <!-- END OF DONUT SELECTION DIV -->

    <div class = "display-info">
        <div id="player-name">POINTS:</div>
        <div id="player-points">0</div>
    </div> <!-- END OF DISPLAY INFO DIV -->

</div> <!-- END OF DONUT SIDEBAR DIV -->

</div> <!-- END OF CONTAINER DIV -->
    <script src="game-state.js"></script>
    <script src="script.js"></script>
</body>
</html>
